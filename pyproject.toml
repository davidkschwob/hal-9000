[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "An educational agent coding harness for local Git repos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.4.0",
    "ollama>=0.1.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.package-data]
harness = ["SYSTEM.md"]

# CRITICAL: This turns your module into a terminal command
[project.scripts]
ask-hal = "harness.cli:main"

